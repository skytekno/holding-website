name: Validate and release
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
defaults:
  run:
    shell: bash
concurrency:
  group: validate-${{ github.ref }}
  # Never cancel a live release or replace its migration job mid-execution.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Static and database checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: skyholding
          POSTGRES_USER: skyholding
          POSTGRES_PASSWORD: sky-local-development-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skyholding -d skyholding"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      REQUIRE_FULL_CHECKS: 'true'
      TEST_DATABASE_URL: postgres://skyholding:sky-local-development-only@localhost:5432/skyholding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: api
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.4'
      - run: npm ci
      - name: Run complete validation
        run: |
          mkdir -p .artifacts
          bash scripts/check.sh 2>&1 | tee .artifacts/checks.log
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/checks.log
          include-hidden-files: true
          retention-days: 14
  integration:
    name: Container and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose up --build -d --wait --wait-timeout 120
      - run: python3 scripts/smoke.py
      - run: npm run test:e2e -- --reporter=line,html
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p .artifacts
          docker compose logs --no-color > .artifacts/compose.log
      - name: Preserve browser and container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .artifacts/compose.log
            playwright-report/
            test-results/
          include-hidden-files: true
          retention-days: 14
      - if: always()
        run: docker compose down
  required:
    # Keep this name stable: the main-branch ruleset requires this exact context.
    name: CI required
    needs: [checks, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHECKS_RESULT: ${{ needs.checks.result }}
      INTEGRATION_RESULT: ${{ needs.integration.result }}
      EVENT_NAME: ${{ github.event_name }}
      SOURCE_REF: ${{ github.ref }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
    steps:
      - name: Require every validation job to pass
        run: |
          printf 'Static/database: %s\nContainers/browser: %s\n' "$CHECKS_RESULT" "$INTEGRATION_RESULT" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$EVENT_NAME" == workflow_dispatch && "$SOURCE_REF" != refs/heads/main ]]; then
            echo 'Manual runs must select main.' >&2
            exit 1
          fi
          if [[ "$CHECKS_RESULT" != success || "$INTEGRATION_RESULT" != success ]]; then
            echo 'Every required validation job must succeed.' >&2
            exit 1
          fi
          if [[ -z "$GCP_PROJECT_ID" ]]; then
            echo 'Deployment is inactive: GCP_PROJECT_ID has not been configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
  build:
    name: Build release images
    needs: required
    if: >-
      github.repository == 'skytekno/holding-website' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      artifact-id: ${{ steps.release-artifact.outputs.artifact-id }}
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-southeast2' }}
      RESOURCE_NAME: ${{ vars.GCP_RESOURCE_NAME || 'skyholding' }}
      RELEASE_ID: r-${{ github.run_id }}-${{ github.run_attempt }}
      COMMIT_SHA: ${{ github.sha }}
      CI_REQUIRED_RESULT: ${{ needs.required.result }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 541.0.0'
      - run: python3 scripts/cloud_release.py build
      - id: release-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/release.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
  deploy:
    name: Release production
    needs: [required, build]
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-southeast2' }}
      RESOURCE_NAME: ${{ vars.GCP_RESOURCE_NAME || 'skyholding' }}
      COMMIT_SHA: ${{ github.sha }}
      CI_REQUIRED_RESULT: ${{ needs.required.result }}
      GH_TOKEN: ${{ github.token }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
      DATABASE_SECRET_VERSION: ${{ vars.DATABASE_SECRET_VERSION }}
      MIGRATION_DATABASE_SECRET_VERSION: ${{ vars.MIGRATION_DATABASE_SECRET_VERSION }}
      DATABASE_CA_SECRET_VERSION: ${{ vars.DATABASE_CA_SECRET_VERSION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # A deploy-only rerun consumes the original build's immutable artifact ID.
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: .artifacts
          merge-multiple: true
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: '>= 541.0.0'
      - run: python3 scripts/cloud_release.py release
      - name: Preserve rollout evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/deployment.json
          include-hidden-files: true
          retention-days: 30
